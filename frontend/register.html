{% extends "base.html" %}
{% block body %}
<main class="split">
  <section class="story">
    <p class="mark">Postroom</p>
    <h1>Tell it who you are. Once.</h1>
    <p>These details are the brief. The studio will not ask what the post is about.</p>
  </section>
  <section class="panel">
    <h2>Register the company</h2>
    {% include "flash.html" %}
    <form method="post" action="/register" class="stack">
      <label>Work email
        <input type="email" name="email" autocomplete="username" required>
      </label>
      <label>Password
        <input type="password" name="password" autocomplete="new-password" minlength="8" required>
      </label>
      <label>Company name
        <input type="text" name="company_name" required>
      </label>
      <label>What you do
        <textarea name="what_they_do" rows="3" required></textarea>
      </label>
      <label>Who you serve
        <textarea name="audience" rows="2" required></textarea>
      </label>
      <label>What you offer
        <textarea name="offer" rows="2" required></textarea>
      </label>
      <label>A proof point
        <textarea name="proof" rows="2" required placeholder="A result, a number, or a customer moment."></textarea>
      </label>
      <label>Voice
        <input type="text" name="voice" required placeholder="Plain, specific, a little dry.">
      </label>
      <label>Brand colors
        <input type="text" name="brand_colors" required placeholder="Ink black, warm sand, copper.">
      </label>
      <label>Website <span>optional</span>
        <input type="url" name="website" placeholder="https://">
      </label>
      <button type="submit" class="primary">Create account</button>
    </form>
    <p class="switch">Already registered? <a href="/login">Log in</a></p>
  </section>
</main>
{% endblock %}
